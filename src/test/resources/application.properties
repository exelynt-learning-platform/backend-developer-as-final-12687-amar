spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=TestSecretKeyForResourceBookingApplication123456789
jwt.expiration=3600000

jwt.issuer=resource-booking-api
jwt.audience=resource-booking-client

seed.admin.username=admin
seed.admin.password=admin

seed.user.username=user
seed.user.password=password

server.port=0